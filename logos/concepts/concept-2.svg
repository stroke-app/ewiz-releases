<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>eWiz</title>
  <defs>
    <path id="tile-shape" d="M50 142C50 91.19 91.19 50 142 50H370C420.81 50 462 91.19 462 142V370C462 420.81 420.81 462 370 462H142C91.19 462 50 420.81 50 370Z"/>
    <clipPath id="tile-clip">
      <use href="#tile-shape"/>
    </clipPath>
    <linearGradient id="tile-fill" x1="0" y1="50" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0094ea"/>
      <stop offset="0.5" stop-color="#007bc4"/>
      <stop offset="1" stop-color="#0f659e"/>
    </linearGradient>
    <linearGradient id="tile-sheen" x1="0" y1="50" x2="0" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="256" cy="232" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51b1fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#51b1fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph-fill" x1="0" y1="130" x2="0" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef3"/>
    </linearGradient>
    <filter id="glyph-shadow" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8" result="blur"/>
      <feFlood flood-color="#142839" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
