<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>eWiz</title>
  <defs>
    <path id="tile-shape" d="M50 142C50 91.19 91.19 50 142 50H370C420.81 50 462 91.19 462 142V370C462 420.81 420.81 462 370 462H142C91.19 462 50 420.81 50 370Z"/>
    <clipPath id="tile-clip">
      <use href="#tile-shape"/>
    </clipPath>
    <linearGradient id="tile-fill" x1="0" y1="50" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0094ea"/>
      <stop offset="0.5" stop-color="#007bc4"/>
      <stop offset="1" stop-color="#0f659e"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="256" cy="150" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51b1fd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#51b1fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-sheen" x1="0" y1="50" x2="0" y2="187" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph-fill" x1="0" y1="130" x2="0" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef3"/>
    </linearGradient>
    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Bold geometric "e": the bowl is a charge arc held at 80% (288deg), the crossbar is the hold line. -->
    <path id="glyph" fill-rule="evenodd" d="M380.06 278A126 126 0 1 0 294.94 375.83L278.25 324.48A72 72 0 0 1 187.44 278ZM187.44 234A72 72 0 0 1 324.56 234Z"/>
  </defs>

  <g id="tile">
    <use href="#tile-shape" fill="url(#tile-fill)"/>
    <use href="#tile-shape" fill="url(#tile-glow)"/>
    <use href="#tile-shape" fill="url(#tile-sheen)"/>
    <use href="#tile-shape" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" clip-path="url(#tile-clip)"/>
    <!-- Unfilled 20% of the charge track, left empty past the limit cut -->
    <path id="track-reserve" d="M309.14 370.25A126 126 0 0 0 377.33 290L319.47 290A72 72 0 0 1 286.37 321.28Z" fill="#ffffff" fill-opacity="0.2"/>
    <use href="#glyph" fill="#142839" fill-opacity="0.35" filter="url(#glyph-shadow)" transform="translate(0 8)"/>
  </g>

  <g id="icon">
    <use href="#glyph" fill="url(#glyph-fill)"/>
  </g>
</svg>
