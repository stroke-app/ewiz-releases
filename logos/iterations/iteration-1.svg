<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>eWiz</title>
  <defs>
    <path id="tile-shape" d="M50 142C50 91.19 91.19 50 142 50H370C420.81 50 462 91.19 462 142V370C462 420.81 420.81 462 370 462H142C91.19 462 50 420.81 50 370Z"/>
    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>

    <linearGradient id="tile-fill" x1="0" y1="50" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b3c40"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="130" cy="96" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-rim" x1="0" y1="50" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="face-lit" x1="170" y1="120" x2="290" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="face-shade" x1="290" y1="140" x2="340" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9cacd"/>
      <stop offset="1" stop-color="#a3a5a9"/>
    </linearGradient>
    <linearGradient id="brim-top" x1="120" y1="0" x2="392" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8e9eb"/>
      <stop offset="1" stop-color="#c4c5c9"/>
    </linearGradient>
    <linearGradient id="brim-rim" x1="120" y1="0" x2="392" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a2a4a8"/>
      <stop offset="1" stop-color="#7a7c81"/>
    </linearGradient>

    <clipPath id="brim-clip"><ellipse cx="256" cy="340" rx="136" ry="30"/></clipPath>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>

    <mask id="bolt-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path fill="#000" d="M244 208H290L268 256H300L226 344L250 288H208Z"/>
    </mask>

    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="tile">
    <use href="#tile-shape" fill="url(#tile-fill)"/>
    <use href="#tile-shape" fill="url(#tile-glow)"/>
    <use href="#tile-shape" fill="none" stroke="url(#tile-rim)" stroke-width="5" clip-path="url(#tile-clip)"/>
  </g>

  <g id="icon" filter="url(#glyph-shadow)">
    <!-- brim: front rim, top face, contact shadow -->
    <path fill="url(#brim-rim)" d="M120 340A136 30 0 0 0 392 340V354A136 30 0 0 1 120 354Z"/>
    <ellipse cx="256" cy="340" rx="136" ry="30" fill="url(#brim-top)"/>
    <g clip-path="url(#brim-clip)">
      <ellipse cx="262" cy="348" rx="106" ry="24" fill="#000" opacity=".22" filter="url(#soft)"/>
    </g>
    <path fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" d="M120 340A136 30 0 0 0 392 340"/><!-- front edge highlight -->
    <!-- cone: shaded right facet, darker tip underside, lit left facet; bolt cut through all -->
    <g mask="url(#bolt-cut)">
      <path fill="url(#face-shade)" d="M158 340C194 290 230 196 250 130C258 104 296 96 326 112C350 124 368 142 382 166C360 148 332 142 314 152C302 160 304 172 306 180C312 234 326 296 354 340A98 21.6 0 0 1 158 340Z"/>
      <path fill="#000" fill-opacity=".1" d="M382 166C352 136 300 130 280 160C276 172 275 184 275 196L306 180C304 172 302 160 314 152C332 142 360 148 382 166Z"/>
      <path fill="url(#face-lit)" d="M158 340C194 290 230 196 250 130C258 104 296 96 326 112C350 124 368 142 382 166C352 136 300 130 280 160C276 172 275 184 275 196L282 360.8A98 21.6 0 0 1 158 340Z"/>
    </g>
    <!-- sparkle -->
    <path fill="url(#face-lit)" d="M174 150Q179.5 174.5 204 180Q179.5 185.5 174 210Q168.5 185.5 144 180Q168.5 174.5 174 150Z"/>
  </g>
</svg>
