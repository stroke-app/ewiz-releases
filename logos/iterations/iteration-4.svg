<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>eWiz</title>
  <defs>
    <path id="tile-shape" d="M50 142C50 91.19 91.19 50 142 50H370C420.81 50 462 91.19 462 142V370C462 420.81 420.81 462 370 462H142C91.19 462 50 420.81 50 370Z"/>
    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>

    <!-- Glyph parts. Union of brim + body = the flat one-colour silhouette. -->
    <path id="brim" d="M116 344A94 24 0 0 1 304 344L304 350A94 24 0 0 1 116 350Z"/>
    <path id="brim-top" d="M116 344A94 24 0 0 1 304 344A94 24 0 0 1 116 344Z"/>
    <path id="body" d="M150 338C172 302 200 232 220 166C228 124 284 110 306 146L392 298L352 298L372 386L288 268L329 268L276 174C268 158 258 156 254 172C252 236 256 296 264 336A57 13 0 0 1 150 338Z"/>
    <g id="glyph"><use href="#brim"/><use href="#body"/></g>
    <clipPath id="brim-top-clip"><use href="#brim-top"/></clipPath>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <!-- the fold's crease splits the body into hat side and bolt side -->
    <clipPath id="hat-side"><path d="M0 0H239L315 512H0Z"/></clipPath>
    <clipPath id="band-zone"><path d="M100 306H170A44 12 0 0 0 258 306H274V426H100Z"/></clipPath>
    <clipPath id="bolt-side"><path d="M239 0H512V512H315Z"/></clipPath>

    <!-- Tile -->
    <linearGradient id="tile-fill" x1="0" y1="50" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b3c40"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="120" cy="90" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim-top" x1="0" y1="50" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Silver -->
    <linearGradient id="silver" x1="170" y1="110" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#dcdde0"/>
      <stop offset="1" stop-color="#a5a7ab"/>
    </linearGradient>
    <linearGradient id="brim-face" x1="116" y1="0" x2="304" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f6f7"/>
      <stop offset=".6" stop-color="#dcdde0"/>
      <stop offset="1" stop-color="#c3c5c8"/>
    </linearGradient>
    <linearGradient id="brim-lip" x1="116" y1="0" x2="304" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfc1c4"/>
      <stop offset="1" stop-color="#8f9195"/>
    </linearGradient>
    <radialGradient id="contact" cx="206" cy="340" r="1" gradientTransform="translate(206 340) scale(78 20) translate(-206 -340)" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone-sheen" x1="146" y1="0" x2="268" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="bolt-sheen" x1="300" y1="146" x2="370" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="band" x1="150" y1="0" x2="266" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e7074" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#6e7074" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3e4044" stop-opacity=".4"/>
    </linearGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
    </filter>

    <!-- crisp light edge on top-left facing contours -->
    <mask id="edge-lit" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#glyph" fill="#fff"/>
      <use href="#glyph" fill="#000" transform="translate(1.4 2)"/>
    </mask>
    <mask id="edge-dark" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#glyph" fill="#fff"/>
      <use href="#glyph" fill="#000" transform="translate(-1.2 -1.6)"/>
    </mask>
  </defs>

  <g id="tile">
    <use href="#tile-shape" fill="url(#tile-fill)"/>
    <use href="#tile-shape" fill="url(#tile-glow)"/>
    <g clip-path="url(#tile-clip)" fill="none" stroke-width="5">
      <use href="#tile-shape" stroke="#fff" stroke-opacity=".16"/>
      <use href="#tile-shape" stroke="url(#rim-top)"/>
    </g>
  </g>

  <g id="icon">
    <use href="#glyph" filter="url(#drop)"/>
    <use href="#brim" fill="url(#brim-lip)"/>
    <use href="#brim-top" fill="url(#brim-face)"/>
    <rect width="512" height="512" fill="url(#contact)" clip-path="url(#brim-top-clip)"/>
    <use href="#body" fill="url(#silver)"/>
    <g clip-path="url(#body-clip)">
      <rect width="512" height="512" fill="url(#cone-sheen)" clip-path="url(#hat-side)"/>
      <rect width="512" height="512" fill="url(#bolt-sheen)" clip-path="url(#bolt-side)"/>
      <rect width="512" height="512" fill="url(#band)" clip-path="url(#band-zone)"/>
      <path d="M170 307A44 12 0 0 0 258 307" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
    </g>
    <rect width="512" height="512" fill="#000" fill-opacity=".18" mask="url(#edge-dark)"/>
    <rect width="512" height="512" fill="#fff" mask="url(#edge-lit)"/>
  </g>
</svg>
